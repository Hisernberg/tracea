[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracea"
version = "0.1.0"
description = "Trace anything running - dynamic reverse engineering for AI agents. MCP server + CLI with evidence records."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Nabid Nur" }]
requires-python = ">=3.10"
keywords = ["mcp", "reverse-engineering", "frida", "dynamic-analysis", "agents", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Security",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "fastmcp>=0.4",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
network = ["dpkt>=7.1", "scapy>=2.5"]
native = ["frida>=16.0", "frida-tools>=12.0"]
android = ["frida>=16.0", "adbutils>=2.0"]
all = ["tracea[network,native,android]"]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10", "build"]

[project.scripts]
tracea = "tracea.cli:app"
tracea-mcp = "tracea.server:main"

[project.urls]
Repository = "https://github.com/Hisernberg/tracea"
Issues = "https://github.com/Hisernberg/tracea/issues"
Space = "https://huggingface.co/spaces/Nabidnur/tracea-demo"
Dataset = "https://huggingface.co/datasets/Nabidnur/tracea-bench"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
